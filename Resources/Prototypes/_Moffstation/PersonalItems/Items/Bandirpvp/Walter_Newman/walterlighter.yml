# Player: BulletKin - Character: Darnell Flett

- type: entity
  name: well-worn vintage flippo
  parent: FlippoLighter
  id: PersonalItemWalterLighter
  description: A rugged metal lighter, lasts quite a while.
  suffix: PersonalItem
  components:
  - type: Sprite
    sprite: _Moffstation/PersonalItems/Items/Bandirpvp/Walter_Newman/walterlighter.rsi
    layers:
    - state: closed
      map: ["base"]
    - state: top
      map: ["top"]
      visible: false
    - state: open
      map: ["open"]
      visible: false
    - state: flame
      map: ["flame"]
      visible: false
      shader: unshaded
  - type: Item
    sprite: _Moffstation/PersonalItems/Items/Bandirpvp/Walter_Newman/walterlighter.rsi

  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-lit
        shader: unshaded
      right:
      - state: inhand-right-lit
        shader: unshaded
  - type: PointLight
    color: plum
  - type: DetailExaminable
    content: An old vintage Interdyne flippo from the early 2200s. There are initials "W N" engraved at the bottom of it.
- type: loadout
  id: PersonalItemWalterLighter
  storage:
    back:
    - PersonalItemWalterLighter
  effects:
  - !type:PersonalItemLoadoutEffect
    character:
    - Walter Newman
